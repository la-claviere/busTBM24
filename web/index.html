/*__LOGIQUE_PURE__ (aucune dépendance DOM — testable avec node)*/
"use strict";

const GRACE_PAST_SEC = 30;
const RT_LOOKBACK_SEC = 45 * 60;
const TZ = "Europe/Paris";
const TRIP_UPDATES_URL = "https://transport.data.gouv.fr/resources/83025/download";

function readVarint(u8, i) {
  let value = 0, shift = 0;
  for (;;) {
    if (i >= u8.length) throw new Error("varint tronqué");
    const b = u8[i++];
    value += (b & 0x7f) * Math.pow(2, shift);
    if (!(b & 0x80)) return { value, next: i };
    shift += 7;
    if (shift > 63) throw new Error("varint trop long");
  }
}

function parseFields(u8) {
  const out = [];
  let i = 0;
  while (i < u8.length) {
    const tag = readVarint(u8, i); i = tag.next;
    const num = Math.floor(tag.value / 8), wt = tag.value % 8;
    if (num === 0) throw new Error("champ 0 invalide");
    if (wt === 0) {
      const v = readVarint(u8, i); i = v.next;
      out.push({ num, wt, varint: v.value, bytes: null });
    } else if (wt === 1) {
      out.push({ num, wt, varint: null, bytes: u8.subarray(i, i + 8) }); i += 8;
    } else if (wt === 2) {
      const l = readVarint(u8, i); i = l.next;
      if (i + l.value > u8.length) throw new Error("longueur hors bornes");
      out.push({ num, wt, varint: null, bytes: u8.subarray(i, i + l.value) }); i += l.value;
    } else if (wt === 5) {
      out.push({ num, wt, varint: null, bytes: u8.subarray(i, i + 4) }); i += 4;
    } else {
      throw new Error("wire type " + wt);
    }
  }
  return out;
}

function pbString(bytes) {
  try { return new TextDecoder("utf-8", { fatal: false }).decode(bytes); }
  catch (_e) { return ""; }
}

/* Décode le flux TripUpdates — tolérant aux particularités TBM :
   - StopTimeUpdate répétés sur le champ 2 de TripUpdate (champ 3 canonique accepté) ;
   - extension propriétaire TBM en champ 3 ({1: "ineo-bus:…", 2: "<destination>"})
     ignorée par validation de forme / exception de décodage. */
function decodeTripUpdates(bytes) {
  const map = new Map();
  const feed = parseFields(bytes);
  for (const f of feed) {
    if (f.num !== 2 || f.bytes === null) continue;
    try {
      const info = parseEntity(f.bytes);
      if (info) map.set(info.tripId, info);
    } catch (_e) { /* entité illisible ignorée (défense en profondeur) */ }
  }
  return map;
}

function parseEntity(bytes) {
  let tripUpdate = null, deleted = false;
  for (const f of parseFields(bytes)) {
    if (f.num === 2 && f.wt === 0 && f.varint === 1) deleted = true;
    else if (f.num === 3 && f.bytes !== null) tripUpdate = f.bytes;
  }
  if (deleted || tripUpdate === null) return null;
  return parseTripUpdate(tripUpdate);
}

function parseTripUpdate(buf) {
  let tripId = "", scheduleRelationship = 0;
  const stops = new Map();
  for (const f of parseFields(buf)) {
    if (f.num === 1 && f.bytes !== null) {
      for (const tf of parseFields(f.bytes)) {
        if (tf.num === 1 && tf.bytes !== null) tripId = pbString(tf.bytes);
        else if (tf.num === 4 && tf.wt === 0) scheduleRelationship = tf.varint;
      }
    } else if ((f.num === 2 || f.num === 3) && f.bytes !== null) {
      let stu = null;
      try { stu = parseStopTimeUpdate(f.bytes); } catch (_e) { stu = null; }
      if (stu) stops.set(stu.stopId, stu);
    }
  }
  if (!tripId) return null;
  return {
    tripId,
    cancelled: scheduleRelationship === 3,
    stop: stops,
  };
}

function parseStopTimeUpdate(buf) {
  let stopId = null;
  let arrival = null, departure = null;
  let scheduleRelationship = null;
  for (const f of parseFields(buf)) {
    if (f.num === 4 && f.bytes !== null) stopId = pbString(f.bytes);
    else if (f.num === 5 && f.wt === 0) scheduleRelationship = f.varint;
    else if ((f.num === 2 || f.num === 3) && f.bytes !== null) {
      let time = null;
      for (const ef of parseFields(f.bytes)) {
        if (ef.num === 2 && ef.wt === 0) time = ef.varint;
      }
      if (f.num === 2) arrival = time; else departure = time;
    }
  }
  if (stopId === null && arrival === null && departure === null) return null;
  return { stopId, arrival, departure, skipped: scheduleRelationship === 1 };
}

/* --- Horaire planifié (structure = schedule24.json, miroir de GtfsData.parse) --- */

function activeServiceIds(schedule, yyyymmdd, parisWeekdayIndex) {
  const active = new Set();
  for (const [sid, mask, start, end] of schedule.calendar) {
    if (yyyymmdd >= start && yyyymmdd <= end && mask.charAt(parisWeekdayIndex) === "1") {
      active.add(sid);
    }
  }
  for (const [date, sid, type] of schedule.exceptions) {
    if (date !== yyyymmdd) continue;
    if (type === 1) active.add(sid);
    else if (type === 2) active.delete(sid);
  }
  return active;
}

/* Passages planifiés pour la date Paris indiquée (epoch minuit = dayStartEpoch). */
function departuresForDate(schedule, yyyymmdd, parisWeekdayIndex, dayStartEpoch) {
  const active = activeServiceIds(schedule, yyyymmdd, parisWeekdayIndex);
  const out = [];
  if (active.size === 0) return out;
  for (const [tripId, sidSec] of Object.entries(schedule.trips)) {
    const [sid, sec] = sidSec;
    if (!active.has(sid)) continue;
    out.push({ tripId, planned: dayStartEpoch + sec });
  }
  return out;
}

/* Fusion planifié + temps réel, mêmes règles que l'application (NextBusService). */
function computePassages(schedule, rtMap, nowSec, dayStartEpochs) {
  const candidates = [];
  for (const { yyyymmdd, weekday, dayStartEpoch } of dayStartEpochs) {
    for (const dep of departuresForDate(schedule, yyyymmdd, weekday, dayStartEpoch)) {
      if (dep.planned < nowSec - RT_LOOKBACK_SEC) continue;
      candidates.push(combine(dep, rtMap.get(dep.tripId)));
    }
  }
  const upcoming = candidates.filter((p) => p.epoch >= nowSec - GRACE_PAST_SEC);
  upcoming.sort((a, b) => a.epoch - b.epoch);
  return upcoming;
}

function combine(dep, info) {
  if (!info || info.cancelled) {
    return { tripId: dep.tripId, planned: dep.planned, epoch: dep.planned,
             realtime: !!info, cancelled: !!(info && info.cancelled) };
  }
  const st = info.stop.get("815");
  if (st && st.skipped) {
    return { tripId: dep.tripId, planned: dep.planned, epoch: dep.planned,
             realtime: true, cancelled: true };
  }
  const estimated = st
    ? (st.departure !== null ? st.departure : (st.arrival !== null ? st.arrival : null))
    : null;
  if (estimated === null) {
    return { tripId: dep.tripId, planned: dep.planned, epoch: dep.planned,
             realtime: false, cancelled: false };
  }
  return { tripId: dep.tripId, planned: dep.planned, epoch: estimated,
           realtime: true, cancelled: false };
}

/* --- Helpers date/heure Europe/Paris (aucune bibliothèque externe) --- */

function parisParts(dateObj) {
  const dtf = new Intl.DateTimeFormat("en-CA", {
    timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
  });
  const [y, m, d] = dtf.format(dateObj).split("-");
  const weekday = new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "short" })
    .format(dateObj);
  const map = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6 };
  return { y, m, d, ymd: `${y}${m}${d}`, weekday: map[weekday] };
}

/* Epoch UTC (secondes) de minuit Europe/Paris pour la date donnée (DST géré). */
function parisDayStartEpoch(y, m, d) {
  const guessMs = Date.UTC(Number(y), Number(m) - 1, Number(d));
  const offsetMin = tzOffsetMinutes(new Date(guessMs));
  let ms = guessMs - offsetMin * 60000;
  const offsetMin2 = tzOffsetMinutes(new Date(ms));
  if (offsetMin2 !== offsetMin) ms = guessMs - offsetMin2 * 60000;
  return Math.floor(ms / 1000);
}

function tzOffsetMinutes(dateObj) {
  const dtf = new Intl.DateTimeFormat("en-US", {
    timeZone: TZ, hour12: false,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
  const p = {};
  for (const part of dtf.formatToParts(dateObj)) p[part.type] = part.value;
  const asUtc = Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day),
                         Number(p.hour) % 24, Number(p.minute), Number(p.second));
  return Math.round((asUtc - dateObj.getTime()) / 60000);
}

function formatParisTime(epochSec) {
  return new Intl.DateTimeFormat("fr-FR", {
    timeZone: TZ, hour: "2-digit", minute: "2-digit",
  }).format(new Date(epochSec * 1000));
}

function formatMinutes(minutes) {
  if (minutes <= 0) return "à l'arrêt";
  if (minutes === 1) return "dans 1 min";
  return `dans ${minutes} min`;
}

function minutesAway(passage, nowSec) {
  const diff = passage.epoch - nowSec;
  return diff <= 0 ? 0 : Math.ceil(diff / 60);
}

function isImminent(passage, nowSec) {
  const m = minutesAway(passage, nowSec);
  return !passage.cancelled && m >= 0 && m <= 5;
}

function isAlert(passage, nowSec) {
  return passage.cancelled || isImminent(passage, nowSec);
}

/* Prochain jour de service (miroir de nextServiceDay) : "HH:MM" ou null. */
function nextServiceDay(schedule, nowSec, parisYmd) {
  const base = new Date();
  for (let offset = 0; offset <= 7; offset++) {
    const d = new Date(base.getTime() + offset * 86400000);
    const parts = parisParts(d);
    const dayStart = parisDayStartEpoch(parts.y, parts.m, parts.d);
    const deps = departuresForDate(schedule, parts.ymd, parts.weekday, dayStart)
      .map((x) => x.planned)
      .filter((planned) => planned >= nowSec);
    if (deps.length === 0) continue;
    if (offset === 0) continue;
    return formatParisTime(Math.min.apply(null, deps));
  }
  return null;
}

const MAX_RESULTS = 6;

function nowSec() { return Math.floor(Date.now() / 1000); }

function dayStartEpochsAroundNow() {
  const now = new Date();
  const today = parisParts(now);
  const yesterday = parisParts(new Date(now.getTime() - 86400000));
  return [
    { yyyymmdd: yesterday.ymd, weekday: yesterday.weekday,
      dayStartEpoch: parisDayStartEpoch(yesterday.y, yesterday.m, yesterday.d) },
    { yyyymmdd: today.ymd, weekday: today.weekday,
      dayStartEpoch: parisDayStartEpoch(today.y, today.m, today.d) },
  ];
}

async function fetchRt() {
  const response = await fetch(TRIP_UPDATES_URL, { cache: "no-store" });
  if (!response.ok) throw new Error("HTTP " + response.status);
  const buf = new Uint8Array(await response.arrayBuffer());
  return decodeTripUpdates(buf);

    : (rtError ? "temps réel indisponible — passage planifié affiché"
               : "temps réel OK" + (age > 0 ? ` (il y a ${age} min)` : ""));
  elStatus.textContent = "Données : " + rtState;
}

async function refresh() {
  try {
    lastRt = await fetchRt();
    rtError = false;
    lastFetchMs = Date.now();
  } catch (_e) {
    rtError = true;
  }
  render();
  scheduleNext();
}

function scheduleNext() {
  if (timer) clearTimeout(timer);
  const now = nowSec();
  const soon = computePassages(SCHEDULE, lastRt, now, dayStartEpochsAroundNow())
    .slice(0, 1)
    .some((p) => p.epoch - now < 45 * 60);
  timer = setTimeout(fetchRt, soon ? RT_INTERVAL_SOON_MS : RT_INTERVAL_NORMAL_MS);
}

elValidity.textContent = "Horaire planifié embarqué valable du " +
  SCHEDULE.valid_from.replace(/^(\d{4})(\d{2})(\d{2})$/, "$1-$2-$3") + " au " +
  SCHEDULE.valid_until.replace(/^(\d{4})(\d{2})(\d{2})$/, "$1-$2-$3") + ".";
document.getElementById("refresh").addEventListener("click", function () {
  if (timer) clearTimeout(timer);
  fetchRt().catch(function () {});
});

/* Premier rendu : horaire planifié immédiat, temps réel ensuite. */
render();
refresh();
</script>
</body>
</html>
